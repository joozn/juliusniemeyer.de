# Sveltia CMS — admin at https://juliusniemeyer.de/admin
# Every "Save" commits to GitHub; GitHub Actions rebuilds the site (~1–2 min).

backend:
  name: github
  repo: joozn/juliusniemeyer.de
  branch: main
  commit_messages:
    update: "Inhalt aktualisiert: {{slug}}"
    uploadMedia: "Bild hochgeladen: {{path}}"
    deleteMedia: "Bild gelöscht: {{path}}"

site_url: https://juliusniemeyer.de
display_url: https://juliusniemeyer.de

media_folder: images
public_folder: /images

# Uploaded photos are converted to WebP and scaled to max. 2400 px in the browser
# before upload, so originals straight from the camera are fine.
media_libraries:
  default:
    config:
      max_file_size: 50000000
      transformations:
        raster_image:
          format: webp
          quality: 88
          width: 2400
          height: 2400

collections:
  - name: works
    label: Werke
    icon: photo_library
    files:
      - name: installation
        label: Installation
        file: content/works/installation.json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Titel (Deutsch), name: title_de, widget: string, required: false, hint: "Leer = englischer Titel auf der deutschen Seite." }
          - { label: Einleitungstext, name: intro, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: Einleitungstext (Deutsch), name: intro_de, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false, hint: "Leer = englischer Text auf der deutschen Seite." }
          - &images
            label: Bilder
            name: images
            widget: list
            collapsed: true
            summary: "{{fields.caption}}"
            hint: "Reihenfolge per Drag & Drop ändern. Die Bildreihen werden automatisch angeordnet."
            fields:
              - { label: Bild, name: image, widget: image }
              - label: Bildnummer (fig.)
                name: fig
                widget: string
                required: false
                hint: "PROJEKT-JJ.NN, z. B. SKI-26.03 = skia, 2026, Bild 3. Leer lassen = wird automatisch vergeben. Einmal vergeben nicht mehr ändern."
              - label: Bildunterschrift
                name: caption
                widget: markdown
                required: false
                buttons: [bold, italic, link]
                editor_components: []
                hint: "Neue Zeile = Zeilenumbruch, Leerzeile = Absatz."
              - label: Bildunterschrift (Deutsch)
                name: caption_de
                widget: markdown
                required: false
                buttons: [bold, italic, link]
                editor_components: []
                hint: "Für die deutsche Seite. Leer = englische Bildunterschrift."
      - name: flat-works
        label: Flat Works
        file: content/works/flat-works.json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Titel (Deutsch), name: title_de, widget: string, required: false, hint: "Leer = englischer Titel auf der deutschen Seite." }
          - { label: Einleitungstext, name: intro, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: Einleitungstext (Deutsch), name: intro_de, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false, hint: "Leer = englischer Text auf der deutschen Seite." }
          - *images
      - name: other
        label: Other
        file: content/works/other.json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Titel (Deutsch), name: title_de, widget: string, required: false, hint: "Leer = englischer Titel auf der deutschen Seite." }
          - { label: Einleitungstext, name: intro, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: Einleitungstext (Deutsch), name: intro_de, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false, hint: "Leer = englischer Text auf der deutschen Seite." }
          - *images

  - name: texts
    label: Texte
    icon: article
    files:
      - name: statement
        label: Artist Statement
        file: content/statement.json
        fields:
          - { label: Titel (linke Spalte), name: title, widget: string }
          - { label: Titel (linke Spalte, Deutsch), name: title_de, widget: string, required: false }
          - { label: Mittlere Spalte, name: column_1, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: Rechte Spalte, name: column_2, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: Mittlere Spalte (Deutsch), name: column_1_de, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false }
          - { label: Rechte Spalte (Deutsch), name: column_2_de, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false }
      - name: cv
        label: CV
        file: content/cv.json
        fields:
          - label: Spalte 1 (CV, Education, …)
            name: column_1
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
            hint: "Überschrift 1 = Spaltentitel, Überschrift 2 = Abschnitt. Jede Zeile ein Eintrag."
          - label: Spalte 2 (Selected Exhibitions)
            name: column_2
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
          - label: Spalte 3 (Writing, Teaching and Curating)
            name: column_3
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
          - label: Spalte 1 (Deutsch)
            name: column_1_de
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
            required: false
          - label: Spalte 2 (Deutsch)
            name: column_2_de
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
            required: false
          - label: Spalte 3 (Deutsch)
            name: column_3_de
            widget: markdown
            buttons: [bold, italic, link, heading-one, heading-two]
            editor_components: []
            required: false

  - name: settings
    label: Einstellungen
    icon: settings
    files:
      - name: site
        label: Allgemein
        file: content/site.json
        fields:
          - label: Aktuell
            name: aktuell
            widget: string
            required: false
            hint: "Erscheint oben neben dem Namen, z. B. Ausstellung ankündigen. Links als [Text](https://…). Leer = keine Zeile. Das Datum oben rechts setzt sich automatisch (letzte Änderung)."
          - { label: Aktuell bis, name: aktuell_bis, widget: datetime, required: false, time_format: false, format: "YYYY-MM-DD", hint: "Ab dem Tag danach verschwindet die Zeile von selbst. Leer = bleibt stehen." }
          - { label: Zitat in der Fußzeile, name: footer_quote, widget: string }
          - { label: Zitat in der Fußzeile (Deutsch), name: footer_quote_de, widget: string, required: false }
          - { label: Text unten rechts, name: footer_credit, widget: string }
          - { label: E-Mail-Adresse, name: email, widget: string }
          - { label: Beschreibung für Google, name: description, widget: text, hint: "Erscheint in Suchergebnissen. Ca. 150 Zeichen." }
          - { label: Beschreibung für Google (Deutsch), name: description_de, widget: text, required: false, hint: "Für die deutsche Seite (/de/). Ca. 150 Zeichen." }
      - name: impressum
        label: Impressum
        file: content/legal/impressum.json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Text, name: body, widget: markdown, editor_components: [] }
      - name: datenschutz
        label: Datenschutz
        file: content/legal/datenschutz.json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Text, name: body, widget: markdown, editor_components: [] }
