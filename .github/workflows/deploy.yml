# Builds the site on every push to main (including every "Save" in the CMS)
# and uploads it via rsync to the Hetzner server (/opt/website/site).
#
# Upload only runs once the repository variable DEPLOY_HOST is set.
# Needed: variable DEPLOY_HOST, secrets DEPLOY_SSH_KEY + DEPLOY_KNOWN_HOSTS.
# The server side restricts the key to rrsync into /opt/website/site.
name: Build & deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shop: repository variables SHOP_LIVE=1 and SPINE_URL (deploy/RUNBOOK-SHOP-LIVE.md). Empty = "coming soon".
      # With SHOP_LIVE=1 the build fails if SPINE is unreachable or legal texts are drafts – then nothing is uploaded.
      - run: npm run build
        env:
          SHOP_LIVE: ${{ vars.SHOP_LIVE }}
          SPINE_URL: ${{ vars.SPINE_URL }}

      - name: Upload to server
        if: vars.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --checksum --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            _site/ "website-deploy@$HOST:./"
